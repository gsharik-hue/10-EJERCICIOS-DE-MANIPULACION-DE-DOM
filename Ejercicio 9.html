<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acordeón</title>

    <link rel="stylesheet" href="estilos 9.css">
</head>
<body>

    <div class="acordeon">

        <button class="pregunta">¿Qué es el DOM?</button>
        <div class="respuesta">
            <p>El DOM es la representación de una página web que permite modificar sus elementos con JavaScript.</p>
        </div>

        <button class="pregunta">¿Qué es un evento?</button>
        <div class="respuesta">
            <p>Un evento es una acción que ocurre en una página web, como hacer clic en un botón.</p>
        </div>

        <button class="pregunta">¿Qué es la delegación?</button>
        <div class="respuesta">
            <p>La delegación de eventos permite manejar eventos de varios elementos desde un elemento contenedor.</p>
        </div>

    </div>

    <script src="script 9.js"></script>

</body>
